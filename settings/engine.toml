# Exemptions: flagged, never actioned. Test accounts: left out of learning,
# measurement and fraud; the accounts internal mode serves. Each entry:
#   { account_id = "<24-char id>", reason = "...", expiry = 2026-12-31, changed_by = "Allen" }
